[package]
name = "mirmir"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Native local model runtime, TUI, CLI, and OpenAI-compatible server"
repository = "https://codeberg.org/mirmir/mirmir.git"
readme = "README.md"
keywords = ["llm", "inference", "grpc", "tui"]
categories = ["command-line-utilities", "development-tools"]
build = "build.rs"
exclude = [".cargo/", "AGENTS.md"]

[workspace]
resolver = "3"
exclude = ["cli", "config", "server", "web"]

[[bin]]
name = "mirmir"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dotenvy = "0.15"
fs2 = "0.4"
futures-util = "0.3"
getrandom = "0.4"
hf-hub = { version = "1.0", features = ["rustls-tls"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
toml = "0.9"
toml_edit = "0.23"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[target.'cfg(target_os = "macos")'.dependencies]
libmir = { version = "0.2.0", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
libmir = { version = "0.2.0", default-features = false, features = ["cuda"] }

[target.'cfg(not(any(target_os = "macos", target_os = "linux")))'.dependencies]
libmir = { version = "0.2.0", default-features = false }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[lints.rust]
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
multiple_crate_versions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
